<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%97%3C/text%3E%3C/svg%3E">
<title>SHEIN – Looks, achadinhos e inspirações</title>
<style id="css">
:root {
  color-scheme: light;
  --bg: #F7F5F0;
  --card: #FFFFFF;
  --ink: #292B28;
  --muted: #686C66;
  --pill: #E5E9E0;
  --line: #E7E3DB;
  --accent: #65745B;
  --accent-ink: #FFFFFF;
  --wa: #65745B;
  --danger: #A8322B;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
.app { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }

.brand { text-align: center; padding: 36px 0 12px; }
.wordmark {
  font-family: "Archivo Black", "Archivo", Impact, sans-serif;
  font-size: 56px; letter-spacing: 1px; line-height: 1; margin: 0; text-decoration: none; display: inline-block;
}
.tagline { margin: 10px 0 0; color: var(--muted); font-size: 18px; }

.hub {
  display: block; text-decoration: none; background: var(--card);
  border-radius: 16px; padding: 24px 26px; margin: 28px 0 24px; border: 1px solid var(--line);
}
.hub h2 { margin: 0 0 4px; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.hub p { margin: 0; color: var(--muted); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .piece:focus-visible {
  outline: 3px solid var(--ink); outline-offset: 3px;
}

.carousel-wrap { position: relative; margin: 0 -16px; }
.carousel {
  display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 4px 16px 12px; scroll-padding: 0 16px; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; overscroll-behavior-x: contain;
}
.carousel::-webkit-scrollbar { display: none; }
.carousel > * { scroll-snap-align: start; flex: 0 0 calc(50% - 22px); min-width: 0; }
.car-btn {
  position: absolute; top: 38%; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  display: grid; place-items: center; box-shadow: 0 1px 3px rgba(41,43,40,.12);
}
.car-btn[hidden] { display: none; }
.car-btn.prev { left: 6px; } .car-btn.next { right: 6px; }
.car-btn svg { width: 20px; height: 20px; }
.all-card {
  display: flex; align-items: center; justify-content: center; text-align: center;
  background: var(--card); border-radius: 16px; text-decoration: none; font-weight: 600;
  padding: 16px; min-height: 260px; border: 1px solid var(--line);
}

.post { background: var(--card); border-radius: 16px; padding: 10px 10px 14px; display: flex; flex-direction: column; border: 1px solid var(--line); }
.post-img { aspect-ratio: 3/4; width: 100%; border-radius: 10px; overflow: hidden; background: var(--pill); }
.post-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post h3 { margin: 12px 4px 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
.post-code { margin: 2px 4px 0; font-size: 13px; color: var(--muted); }
.post-open {
  margin: 12px 0 0; padding: 12px 14px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; text-align: center; cursor: pointer;
  font-size: 15px; font-weight: 600;
}

.section-title { margin: 32px 4px 14px; font-size: 20px; font-weight: 600; color: var(--ink); }
.pills { display: flex; flex-wrap: wrap; gap: 10px; }
.pill { background: var(--pill); border-radius: 999px; padding: 10px 22px; font-weight: 600; text-decoration: none; font-size: 17px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--wa); color: #fff; text-decoration: none; font-weight: 700;
  border-radius: 14px; padding: 16px 22px; margin-top: 28px; font-size: 17px;
}
.btn small { display: block; font-weight: 500; opacity: .92; font-size: 14px; }
.btn svg { width: 24px; height: 24px; flex: none; }

.back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600; padding: 8px 4px; margin-bottom: 4px; }
.back svg { width: 18px; height: 18px; }
.page-title { font-size: 28px; font-weight: 700; margin: 6px 4px 4px; }
.page-sub { margin: 0 4px 16px; color: var(--muted); }
.search {
  display: flex; align-items: center; gap: 10px; background: var(--card);
  border-radius: 999px; padding: 4px 8px 4px 18px; margin-bottom: 20px; border: 1px solid var(--line);
}
.search:focus-within { border-color: var(--accent); }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; border: 0; background: none; padding: 12px 0; min-width: 0; outline: none; font-size: 17px; }
.search input::placeholder { color: var(--muted); }
.search .clear { border: 0; background: var(--pill); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.empty { background: var(--card); border-radius: 24px; padding: 28px 22px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.overlay[hidden] { display: none; }
.sheet {
  background: var(--bg); width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh;
  border-radius: 28px 28px 0 0; display: flex; flex-direction: column; animation: up .25s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 22px; }
.sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.sheet-close { border: 0; background: var(--pill); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 22px; line-height: 1; flex: none; }
.sheet-body { overflow-y: auto; padding: 6px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.piece { display: flex; align-items: center; gap: 14px; background: var(--card); text-decoration: none; border-radius: 16px; padding: 10px; border: 1px solid var(--line); }
.piece .thumb { width: 72px; height: 72px; border-radius: 14px; overflow: hidden; background: var(--pill); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.piece .name { font-weight: 600; flex: 1; min-width: 0; }
.piece .go { color: var(--ink); font-size: 13px; font-weight: 500; display: block; margin-top: 2px; text-decoration: underline; text-underline-offset: 3px; }
.piece svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.aviso { margin: 20px 8px 0; font-size: 12.5px; color: var(--muted); text-align: center; }

/* ---------- Painel de edição (só aparece para a dona do site) ---------- */
.edit-fab {
  position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
  padding: 12px 20px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.3);
}
.ed { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.ed[hidden] { display: none; }
.ed-bar {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
  background: var(--card); border-bottom: 1px solid var(--line);
}
.ed-sp { flex: 1; }
.ed-x { border: 0; background: var(--pill); width: 40px; height: 40px; border-radius: 50%; font-size: 22px; line-height: 1; cursor: pointer; }
.ed-body { flex: 1; overflow-y: auto; padding: 14px 16px calc(40px + env(safe-area-inset-bottom, 0px)); max-width: 560px; width: 100%; margin: 0 auto; }
.ed-btn {
  display: inline-flex; align-items: center; justify-content: center; border: 0; background: var(--pill);
  border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; font-size: 15px;
}
.ed-btn.pri { background: var(--accent); color: var(--accent-ink); }
.ed-btn.dan { color: var(--danger); }
.ed-btn[disabled] { opacity: .45; cursor: default; }
.ed-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.ed-h { margin: 22px 2px 10px; font-size: 18px; }
.ed-msg { min-height: 1.4em; margin: 0 2px 8px; font-weight: 600; }
.ed-row { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 18px; padding: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.ed-row .thumb { width: 52px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--pill); flex: none; }
.ed-info { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
.ed-info small { color: var(--muted); }
.ed-f { display: flex; flex-direction: column; gap: 6px; margin: 14px 0; font-weight: 600; font-size: 15px; }
.ed-f input, .ed-f select {
  border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-weight: 400; font-size: 16px; width: 100%;
}
.ed-photo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ed-photo .thumb { width: 72px; height: 96px; border-radius: 12px; overflow: hidden; background: var(--pill); }
.ed-peca { background: var(--card); border-radius: 20px; padding: 6px 14px 14px; margin: 12px 0; }
.ed-peca .ed-photo .thumb { width: 64px; height: 64px; }
.ed-pick { position: relative; overflow: hidden; }
.ed-file { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.ed-size { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .carousel { scroll-behavior: auto; } }
</style>
</head>

    '<h3>' + esc(p.titulo) + '</h3>' + (norm(p.titulo).indexOf(norm(p.codigo)) < 0 ? '<p class="post-code">Código ' + esc(p.codigo) + '</p>' : '') + '<button class="post-open" data-ver="' + idx(p) + '">Ver peças</button></article>';
}

/* ---------- Páginas ---------- */
function paginaInicial() {
  const C = DATA.config;
  const looks = postsDe("looks").slice(0, C.quantosNoCarrossel || 5);
  const cats = CATEGORIAS.map(c => '<a class="pill" href="#/cat/' + c.id + '">' + esc(c.nome) + '</a>').join("");
  return '<header class="brand"><a class="wordmark" href="#/">SHEIN</a><p class="tagline">' + esc(C.frase) + '</p></header>' +
    '<a class="hub" href="#/looks"><h2>Looks completos</h2><p>Encontre as peças das publicações</p></a>' +
    '<div class="carousel-wrap"><button class="car-btn prev" id="prev" aria-label="Looks anteriores" hidden>' + ICON.left + '</button>' +
    '<div class="carousel" id="carousel" tabindex="0" aria-label="Looks em destaque">' + looks.map(postCard).join("") +
    '<a class="all-card" href="#/looks">Ver todos<br>os looks</a></div>' +
    '<button class="car-btn next" id="next" aria-label="Próximos looks">' + ICON.right + '</button></div>' +
    '<h2 class="section-title">Outras categorias</h2><nav class="pills" aria-label="Categorias">' + cats + '</nav>' +
    '<a class="btn" href="' + esc(safeUrl(C.linkWhatsApp)) + '" target="_blank" rel="noopener">' + ICON.wa +
    '<span>' + esc(C.textoWhatsApp) + '<small>' + esc(C.subtextoWhatsApp) + '</small></span></a>' +
    '<p class="aviso">Alguns links são de afiliado: se você comprar por eles, posso receber uma pequena comissão, sem custo extra para você.</p>';
}

function paginaLista(cat) {
  const nome = cat === "looks" ? "Looks completos" : nomeCat(cat);
  if (!nome) return paginaNaoEncontrada();
  const sub = cat === "looks" ? "Digite o número do look que você viu no feed." : "Digite o número da publicação que você viu no feed.";
  return '<a class="back" href="#/">' + ICON.left + ' Início</a><h1 class="page-title">' + esc(nome) + '</h1><p class="page-sub">' + sub + '</p>' +
    '<label class="search">' + ICON.search + '<input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Buscar pelo número, ex.: 543" aria-label="Buscar pelo número">' +
    '<button class="clear" id="clear" aria-label="Limpar busca" hidden>×</button></label><div class="grid" id="grid" aria-live="polite"></div>';
}

function paginaNaoEncontrada() {
  return '<a class="back" href="#/">' + ICON.left + ' Início</a><div class="empty"><strong>Página não encontrada</strong>Volte ao início e escolha uma categoria.</div>';
}

function preencherGrid(cat, termo) {
  const grid = document.getElementById("grid");
  if (!grid) return;
  const t = norm(termo).replace(/^(look|sapato|post)\s*/, "");
  const todos = postsDe(cat);
  const lista = t ? todos.filter(p => norm(p.codigo).includes(t) || norm(p.titulo).includes(t)) : todos;
  if (lista.length) grid.innerHTML = lista.map(postCard).join("");
  else if (!todos.length) grid.innerHTML = '<div class="empty"><strong>Em breve</strong>Ainda não publiquei nada nesta categoria.</div>';
  else grid.innerHTML = '<div class="empty"><strong>Nenhum resultado para "' + esc(termo) + '"</strong>Confira o número na legenda do post e tente de novo.</div>';
}

/* ---------- Carrossel ---------- */
function ligarCarrossel() {
  const car = document.getElementById("carousel");
  if (!car) return;
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  const passo = () => Math.max(car.clientWidth * 0.8, 160);
  const atualizar = () => {
    const max = car.scrollWidth - car.clientWidth - 4;
    prev.hidden = car.scrollLeft < 8;
    next.hidden = car.scrollLeft >= max;
  };
  prev.addEventListener("click", () => car.scrollBy({ left: -passo(), behavior: "smooth" }));
  next.addEventListener("click", () => car.scrollBy({ left: passo(), behavior: "smooth" }));
  car.addEventListener("scroll", atualizar, { passive: true });
  window.addEventListener("resize", atualizar);
  car.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") car.scrollBy({ left: passo(), behavior: "smooth" });
    if (e.key === "ArrowLeft") car.scrollBy({ left: -passo(), behavior: "smooth" });
  });
  atualizar();
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setTimeout(() => {
      if (car.scrollLeft === 0) {
        car.scrollTo({ left: 70, behavior: "smooth" });
        setTimeout(() => { if (car.scrollLeft < 100) car.scrollTo({ left: 0, behavior: "smooth" }); }, 700);
      }
    }, 900);
  }
}

/* ---------- Lista de peças ---------- */
let ultimoFoco = null;
function abrirPecas(i) {
  const p = DATA.posts[i];
  if (!p) return;
  ultimoFoco = document.activeElement;
  document.getElementById("sheet-title").textContent = p.titulo;
  document.getElementById("sheet-sub").textContent = "Código " + p.codigo + " · " + (p.pecas.length === 1 ? "1 peça" : p.pecas.length + " peças");
  document.getElementById("sheet-body").innerHTML = p.pecas.map((pc, k) =>
    '<a class="piece" href="' + esc(safeUrl(pc.link)) + '" target="_blank" rel="sponsored noopener">' +
    '<span class="thumb"><img src="' + pieceImg(pc, k) + '" alt="" loading="lazy"></span>' +
    '<span class="name">' + esc(pc.nome) + '<span class="go">Ver na SHEIN</span></span>' + ICON.out + '</a>').join("");
  overlay.hidden = false;
  document.body.style.overflow = "hidden";
  document.getElementById("sheet-close").focus();
}
function fecharPecas() {
  overlay.hidden = true;
  document.body.style.overflow = "";
  if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
}
overlay.addEventListener("click", e => { if (e.target === overlay) fecharPecas(); });
document.getElementById("sheet-close").addEventListener("click", fecharPecas);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !overlay.hidden) fecharPecas(); });

/* ---------- Rotas ---------- */
function rota() {
  if (!overlay.hidden) fecharPecas();
  const [, tipo, arg] = (location.hash || "#/").split("/");
  let html, cat = null;
  if (!tipo) html = paginaInicial();
  else if (tipo === "looks") { html = paginaLista("looks"); cat = "looks"; }
  else if (tipo === "cat") { html = paginaLista(arg); cat = arg; }
  else html = paginaNaoEncontrada();
  app.innerHTML = html;
  window.scrollTo(0, 0);
  document.title = "SHEIN – " + (cat ? (cat === "looks" ? "Looks completos" : nomeCat(cat)) : DATA.config.frase);
  if (!tipo) ligarCarrossel();
  if (cat && document.getElementById("grid")) {
    const q = document.getElementById("q"), clear = document.getElementById("clear");
    preencherGrid(cat, "");
    q.addEventListener("input", () => { clear.hidden = !q.value; preencherGrid(cat, q.value); });
    clear.addEventListener("click", () => { q.value = ""; clear.hidden = true; preencherGrid(cat, ""); q.focus(); });
  }
}
app.addEventListener("click", e => {
  const b = e.target.closest("[data-ver]");
  if (b) abrirPecas(Number(b.dataset.ver));
});
window.addEventListener("hashchange", rota);
rota();

let draft = null, dirty = false, view = "lista", cur = null, confirmDel = -1, msg = "";

/* Monta o site completo de novo, com os looks atuais, para publicar uma nova versão */
function gerarHTML(d) {
  const S = "script";
  const css = document.getElementById("css").textContent;
  const js = document.getElementById("appjs").textContent;
  const json = JSON.stringify(d).replace(/</g, "\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n" + HEAD +
    "<title>" + esc("SHEIN – " + d.config.frase) + "</title>\n<style id=\"css\">" + css + "</style>\n</head>\n<body>\n" +
    "<div class=\"app\" id=\"app\"></div>\n" +
    "<" + S + " type=\"application/json\" id=\"dados\">\n" + json + "\n</" + S + ">\n" +
    "<" + S + " id=\"appjs\">" + js + "</" + S + ">\n</body>\n</html>\n";
}

async function lerImagem(file, max, q) {
  try {
    const bm = await createImageBitmap(file);
    const r = Math.min(1, max / Math.max(bm.width, bm.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bm.width * r); c.height = Math.round(bm.height * r);
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(bm, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } catch (e) {
    return lerImagemAntigo(file, max, q);
  }
}
function lerImagemAntigo(file, max, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("leitura"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error("imagem"));
      im.onload = () => {
        const r = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function say(t) { msg = t; const m = document.getElementById("ed-msg"); if (m) m.textContent = t; }

function edLista() {
  const grupos = [["looks", "Looks completos"]].concat(CATEGORIAS.map(c => [c.id, c.nome]));
  let h = '<div class="ed-actions"><button class="ed-btn pri" data-a="novo">+ Novo post</button><button class="ed-btn" data-a="textos">Textos e WhatsApp</button></div>';
  grupos.forEach(([id, nome]) => {
    const itens = draft.posts.map((p, i) => [p, i]).filter(([p]) => p.categoria === id);
    if (!itens.length) return;
    h += '<h3 class="ed-h">' + esc(nome) + '</h3>';
    itens.forEach(([p, i]) => {
      h += '<div class="ed-row"><span class="thumb"><img src="' + postImg(p, i) + '" alt=""></span>' +
        '<span class="ed-info"><strong>' + esc(p.titulo) + '</strong><small>Nº ' + esc(p.codigo) + ' · ' + p.pecas.length + (p.pecas.length === 1 ? ' peça' : ' peças') + '</small></span>' +
        '<button class="ed-btn" data-a="editar" data-i="' + i + '">Editar</button>' +
        '<button class="ed-btn dan" data-a="excluir" data-i="' + i + '">' + (confirmDel === i ? "Confirmar" : "Excluir") + '</button></div>';
    });
  });
  if (!draft.posts.length) h += '<div class="empty"><strong>Nenhum post ainda</strong>Toque em "+ Novo post" para começar.</div>';
  return h;
}

function edForm() {
  const p = cur.post;
  const opts = [["looks", "Look completo"]].concat(CATEGORIAS.map(c => [c.id, c.nome]))
    .map(([id, n]) => '<option value="' + id + '"' + (p.categoria === id ? " selected" : "") + '>' + esc(n) + '</option>').join("");
  let h = '<button class="ed-btn" data-a="voltar">Voltar</button><h3 class="ed-h">' + (cur.i < 0 ? "Novo post" : "Editar post") + '</h3>' +
    '<label class="ed-f">Número do post (o que a pessoa digita na busca)<input data-f="codigo" value="' + esc(p.codigo) + '" inputmode="numeric" autocomplete="off"></label>' +
    '<label class="ed-f">Onde aparece<select data-f="categoria">' + opts + '</select></label>' +
    '<label class="ed-f">Nome do bloco (se deixar vazio, eu crio)<input data-f="titulo" value="' + esc(p.titulo) + '" placeholder="Ex.: Look 543" autocomplete="off"></label>' +
    '<div class="ed-f">Foto do post<div class="ed-photo"><span class="thumb"><img src="' + postImg(p, 0) + '" alt=""></span>' +
    '<label class="ed-btn ed-pick">Escolher foto<input type="file" accept="image/*" data-foto="post" class="ed-file"></label></div></div>' +
    '<h3 class="ed-h">Peças</h3>';
  p.pecas.forEach((x, k) => {
    h += '<div class="ed-peca"><label class="ed-f">Nome da peça<input data-pf="nome" data-i="' + k + '" value="' + esc(x.nome) + '" autocomplete="off"></label>' +
      '<label class="ed-f">Link de afiliado<input data-pf="link" data-i="' + k + '" value="' + esc(x.link) + '" inputmode="url" placeholder="https://" autocomplete="off"></label>' +
      '<div class="ed-photo"><span class="thumb"><img src="' + pieceImg(x, k) + '" alt=""></span>' +
      '<label class="ed-btn ed-pick">Foto da peça<input type="file" accept="image/*" data-foto="peca" data-i="' + k + '" class="ed-file"></label>' +
      '<button class="ed-btn dan" data-a="rmpeca" data-i="' + k + '">Remover peça</button></div></div>';
  });
  h += '<div class="ed-actions"><button class="ed-btn" data-a="addpeca">+ Adicionar peça</button></div>' +
    '<div class="ed-actions" style="margin-top:18px"><button class="ed-btn pri" data-a="salvarpost">Salvar post</button></div>';

function edTextos() {
  const c = draft.config;
  return '<button class="ed-btn" data-a="voltar">Voltar</button><h3 class="ed-h">Textos e WhatsApp</h3>' +
    '<label class="ed-f">Frase embaixo de SHEIN<input data-cf="frase" value="' + esc(c.frase) + '"></label>' +
    '<label class="ed-f">Link do canal ou grupo do WhatsApp<input data-cf="linkWhatsApp" value="' + esc(c.linkWhatsApp) + '" inputmode="url"></label>' +
    '<label class="ed-f">Título do botão do WhatsApp<input data-cf="textoWhatsApp" value="' + esc(c.textoWhatsApp) + '"></label>' +
    '<label class="ed-f">Frase pequena do botão<input data-cf="subtextoWhatsApp" value="' + esc(c.subtextoWhatsApp) + '"></label>' +
    '<div class="ed-actions"><button class="ed-btn pri" data-a="voltar">Pronto</button></div>';
}

function edRender() {
  const ed = document.getElementById("ed");
  const old = ed.querySelector(".ed-body");
  const sc = old ? old.scrollTop : 0;
  const mb = (gerarHTML(draft).length / 1048576).toFixed(1);
  ed.innerHTML = '<div class="ed-bar"><strong>Editar site</strong><span class="ed-sp"></span>' +
    '<button class="ed-btn pri" data-a="publicar"' + (dirty ? "" : " disabled") + '>Publicar</button>' +
    '<button class="ed-x" data-a="fechar" aria-label="Fechar editor">×</button></div>' +
    '<div class="ed-body"><p class="ed-msg" role="status" id="ed-msg">' + esc(msg) + '</p>' +
    (view === "lista" ? edLista() : view === "post" ? edForm() : edTextos()) +
    '<p class="ed-size">Tamanho do site: ' + mb + ' MB de 16 MB</p></div>';
  const nb = ed.querySelector(".ed-body");
  if (nb) nb.scrollTop = sc;
}

function salvarPost() {
  const p = cur.post;
  p.codigo = String(p.codigo).trim();
  if (!p.codigo) { say("Coloque o número do post."); return false; }
  if (draft.posts.some((q, k) => k !== cur.i && q.categoria === p.categoria && norm(q.codigo) === norm(p.codigo))) {
    say("Já existe um post com esse número nessa categoria."); return false;
  }
  const pecas = p.pecas.map(x => ({ nome: x.nome.trim(), link: x.link.trim(), foto: x.foto })).filter(x => x.nome || x.link);
  if (!pecas.length) { say("Adicione pelo menos uma peça."); return false; }
  for (const x of pecas) {
    if (!x.nome) { say("Toda peça precisa de um nome."); return false; }
    if (!/^https?:\/\//i.test(x.link)) { say('O link de "' + x.nome + '" precisa começar com https://'); return false; }
  }
  p.pecas = pecas;
  p.titulo = p.titulo.trim() || ((p.categoria === "looks" ? "Look " : nomeCat(p.categoria) + " ") + p.codigo);
  if (cur.i < 0) draft.posts.unshift(p); else draft.posts[cur.i] = p;
  dirty = true; view = "lista"; cur = null;
  say("Post salvo. Toque em Publicar para ele aparecer no site.");
  return true;
}

async function publicar(art) {
  say("Publicando...");
  try {
    await art.publish(gerarHTML(draft));
    say("Publicado! Atualizando o site...");
  } catch (err) {
    const c = err && err.code;
    say(c === "conflict" ? "O site foi atualizado em outro lugar e vai recarregar. Refaça a alteração depois."
      : c === "too_large" ? "O site ficou grande demais. Apague alguns posts ou use menos fotos."
      : (c === "not_writer" || c === "not_granted" || c === "capability_disabled" || c === "consent_required")
        ? "Este link não permite salvar por aqui. Abra o site pela sua conta do Claude para editar."
      : c === "rate_limited" ? "Muitas publicações seguidas. Espere um minuto e tente de novo."
      : "Não consegui publicar agora. Tente de novo em instantes.");
  }
}

function ligarEditor(ed, art) {
  ed.addEventListener("click", async e => {
    const b = e.target.closest("[data-a]");
    if (!b || b.disabled) return;
    const a = b.dataset.a, i = Number(b.dataset.i);
    if (a !== "excluir") confirmDel = -1;
    if (a === "fechar") { ed.hidden = true; document.body.style.overflow = ""; return; }
    if (a === "publicar") { await publicar(art); return; }
    if (a === "novo") { cur = { i: -1, post: { codigo: "", categoria: "looks", titulo: "", foto: "", pecas: [{ nome: "", foto: "", link: "" }] } }; view = "post"; say(""); }
    else if (a === "editar") { cur = { i, post: JSON.parse(JSON.stringify(draft.posts[i])) }; view = "post"; say(""); }
    else if (a === "excluir") {
      if (confirmDel === i) { draft.posts.splice(i, 1); dirty = true; confirmDel = -1; say("Post excluído. Toque em Publicar para valer no site."); }
      else { confirmDel = i; say("Toque de novo em Confirmar para excluir."); }
    }
    else if (a === "voltar") { view = "lista"; cur = null; say(""); }
    else if (a === "textos") { view = "textos"; say(""); }
    else if (a === "addpeca") cur.post.pecas.push({ nome: "", foto: "", link: "" });
    else if (a === "rmpeca") cur.post.pecas.splice(i, 1);
    else if (a === "salvarpost") { if (!salvarPost()) return; }
    edRender();
  });
  ed.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.f && cur) cur.post[t.dataset.f] = t.value;
    else if (t.dataset.pf && cur) cur.post.pecas[Number(t.dataset.i)][t.dataset.pf] = t.value;
    else if (t.dataset.cf) {
      draft.config[t.dataset.cf] = t.value; dirty = true;
      const pb = ed.querySelector('[data-a="publicar"]'); if (pb) pb.disabled = false;
    }
  });
  ed.addEventListener("change", async e => {
    const t = e.target;
    if (!t.dataset.foto || !t.files || !t.files[0] || !cur) return;
    try {
      say("Lendo a foto..."); if (t.dataset.foto === "post") cur.post.foto = await lerImagem(t.files[0], 900, 0.8);
      else cur.post.pecas[Number(t.dataset.i)].foto = await lerImagem(t.files[0], 360, 0.78);
      say("Foto adicionada."); edRender();
    } catch (err) { say("Não consegui ler essa foto. Tente outra, de preferência em JPG ou PNG."); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !ed.hidden) { ed.hidden = true; document.body.style.overflow = ""; } });
}

function abrirEditor(art) {
  if (!draft) draft = JSON.parse(JSON.stringify(DATA));
  let ed = document.getElementById("ed");
  if (!ed) {
    document.body.insertAdjacentHTML("beforeend", '<div class="ed" id="ed" role="dialog" aria-modal="true" aria-label="Editar site"></div>');
    ed = document.getElementById("ed");
    ligarEditor(ed, art);
  }
  ed.hidden = false;
  document.body.style.overflow = "hidden";
  view = "lista"; cur = null;
  edRender();
}

/* O botão "Editar site" só aparece para a dona; quem visita não vê nada disso */
(async function () {
  try {
    if (!window.claude || !claude.use) return;
    const u = await claude.use("user");
    const art = await claude.use("artifact");
    if (!u || !art) return;
    const ok = (await u.isOwner()) || (await u.canEdit());
    if (!ok) return;
    document.body.insertAdjacentHTML("beforeend", '<button class="edit-fab" id="fab">Editar site</button>');
    document.getElementById("fab").addEventListener("click", () => abrirEditor(art));
  } catch (e) { /* sem painel de edição neste modo de visualização */ }
})();
